<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/images/prodsmartlogo.png" type="image/x-icon">
  <title>ProdSmart — Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #1e40af;
      --success: #10b981;
      --error: #ef4444;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--bg) 0%, #1a2942 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Efeito de fundo animado */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
      animation: float 15s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(30px, 30px) rotate(180deg); }
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      object-fit: contain;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.05);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    input::placeholder {
      color: var(--text-dim);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: var(--text-dim);
      transition: color 0.2s;
      user-select: none;
    }

    .toggle-password:hover {
      color: var(--text);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      margin-top: 28px;
      background: linear-gradient(135deg, var(--primary), #0ea5e9);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login.loading::after {
      content: '';
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-left: 8px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #86efac;
    }

    .message.show {
      display: block;
    }

    .footer-info {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .footer-info strong {
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 28px;
      }

      h1 {
        font-size: 24px;
      }

      .logo-icon {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div class="logo-section">
      <img src="./assets/images/prodsmartlogo.png" alt="Logo" class="logo-icon">
      <h1>ProdSmart</h1>
      <p class="subtitle">Painel de controle</p>
    </div>

    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input 
          type="text" 
          id="usuario" 
          placeholder="ex: admin" 
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            id="senha" 
            placeholder="Digite sua senha" 
            required
            autocomplete="current-password"
          >
          <span class="toggle-password" onclick="togglePassword()" title="Mostrar/ocultar">👁</span>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-submit">Entrar</button>
    </form>

    <div class="message" id="message"></div>

    <div class="footer-info">
      Demo: <strong>admin</strong> / <strong>admin123</strong>
    </div>
  </div>
</div>

<script>
  // Alternar visibilidade da senha
  function togglePassword() {
    const input = document.getElementById('senha');
    const icon = event.target;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = '🔒';
    } else {
      input.type = 'password';
      icon.textContent = '👁';
    }
  }

  // Detectar Enter
  document.getElementById('form-login').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      handleLogin(e);
    }
  });

  // Função de login
  async function handleLogin(e) {
    e.preventDefault();

    const usuario = document.getElementById('usuario').value.trim();
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('btn-submit');
    const msg = document.getElementById('message');

    if (!usuario || !senha) {
      showMessage('Preencha todos os campos', 'error');
      return;
    }

    // Desabilitar botão
    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = 'Autenticando';

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ usuario, senha })
      });

      const data = await response.json();

      if (!response.ok) {
        showMessage(data.erro || 'Erro ao fazer login', 'error');
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.textContent = 'Entrar';
        return;
      }

      // Salvar token
      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('usuario', data.usuario);

      showMessage('Login realizado com sucesso!', 'success');
      
      // Redirecionar após 1 segundo
      setTimeout(() => {
        window.location.href = 'painel.html';
      }, 1000);

    } catch (error) {
      console.error('Erro:', error);
      showMessage('Erro de conexão. Tente novamente.', 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = 'Entrar';
    }
  }

  function showMessage(msg, type) {
    const el = document.getElementById('message');
    el.textContent = msg;
    el.className = `message ${type} show`;
  }

  // Limpar token ao carregar (força novo login)
  if (window.location.search.includes('logout')) {
    localStorage.removeItem('auth_token');
    showMessage('Desconectado com sucesso', 'success');
  }
</script>

</body>
</html>
