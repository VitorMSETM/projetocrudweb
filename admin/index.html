<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Vyzee Brasil — Admin</title>
  <link rel="icon" href="../assets/icons/IconVyzee.ico">

  <!-- RESPONSIVIDADE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 15px;
    }

    /* PARTÍCULAS */

    #tsparticles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background-color: #000;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 15, 10, 0.98);
      border: 1px solid #fff;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .logo-crop {
      width: 120px;           /* Defina o tamanho do quadrado aqui */
      height: 120px;          /* Deve ser igual à largura para ser um quadrado perfeito */
      margin: 0 auto 15px auto; /* Centraliza o quadrado e dá margem inferior */
      overflow: hidden;       /* Tudo o que sair do quadrado será cortado (o crop) */
      border-radius: 10px;    /* Opcional: cantos arredondados no recorte */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-crop img {
      width: 100%;            /* A imagem tenta preencher a largura do container */
      height: 100%;           /* A imagem tenta preencher a altura do container */
      object-fit: cover;      /* MÁGICA AQUI: A imagem é redimensionada para preencher o quadrado,
                                mantendo a proporção e cortando o excesso nas bordas. */
      object-position: center; /* Garante que o corte seja feito centralizado */

      /* Mantenha o filtro antigo COMENTADO, como resolvemos na etapa anterior */
      /* filter: brightness(0) invert(1); */
    }

    h2 {
      margin-bottom: 5px;
      color: #FFFFFF;
      font-weight: bold;
    }

    .subtitle {
      font-size: 13px;
      color: #FFFFFF;
      margin-bottom: 20px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .input-group {
      position: relative;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #1a1a1a;
      color: white;
      outline: none;
      transition: 0.3s;
      font-size: 14px;
    }

    input:focus {
      border: 1px solid #FFFFFF;
      box-shadow: 0 0 15px rgb(255, 255, 255);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      background: linear-gradient(135deg, #FFFFFF, #FFFFFF);
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 15px;
      letter-spacing: 1px;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgb(255, 255, 255);
    }

    .error {
      color: #ff0000;
      font-size: 13px;
      margin-top: 10px;
      display: none;
      font-weight: 600;
    }

    .info {
      color: #FFFFFF;
      font-size: 11px;
      margin-top: 8px;
      padding: 8px;
      background: rgb(255, 255, 255);
      border: 1px solid rgb(255, 255, 255);
      border-radius: 6px;
      display: none;
    }

    @media (max-width: 400px) {
      .login-box {
        padding: 25px 18px;
      }

      input {
        padding: 12px;
      }

      button {
        padding: 12px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles-all-bundle@3.1.0/tsparticles.all.bundle.min.js"></script>
</head>

<body>

  <div id="tsparticles"></div>

  <div class="login-box">

    <div class="logo">
      <div class="logo-crop">
        <img src="../assets/images/LogoVyzeeBrancaSemFundo.png">
      </div>
    </div>

    <h2>Vyzee Brasil</h2>
    <div class="subtitle">PAINEL ADMINISTRATIVO</div>

    <div class="input-group">
      <input type="text" id="user" placeholder="Usuário" value="Vyzee" readonly style="cursor:default;opacity:0.8">
    </div>

    <div class="input-group">
        <input type="password" id="pass" placeholder="Senha">
        <span onclick="togglePassword()" style="
          position:absolute;
          right:15px;
          top:50%;
          transform:translateY(-50%);
          cursor:pointer;
          font-size:13px;
          color:#aaa;
        ">👁</span>
      </div>

    <button onclick="login()">ENTRAR</button>

    <div class="error" id="error">❌ Senha incorreta</div>
    <div class="info" id="info">✓ Login e senha configurados com sucesso!</div>

  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById("pass");
    
      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    }
    </script>

  <script>
    const USER = "Vyzee";

    const HASH = "f0db12c141a4e273a40ede739e5b5204662c2afb82e6af23339969ad122ce49b";

    async function hash(text) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const buffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    async function login() {
      const user = document.getElementById("user").value;
      const pass = document.getElementById("pass").value;
      const error = document.getElementById("error");

      const passHash = await hash(pass);

      if (user === USER && passHash === HASH) {
        localStorage.setItem("vyzee_auth", "true");
        window.location.href = "painel.html";
      } else {
        error.style.display = "block";
        document.getElementById("pass").value = "";
        document.getElementById("pass").focus();
      }
    }
  </script>

  <script>
    // Detectar tecla Enter no campo de senha
    document.getElementById("pass").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        login();
      }
    });

    // Função assíncrona para garantir o carregamento do motor v3
    async function loadParticles() {
      await tsParticles.load({
        id: "tsparticles",
        options: {
          background: {
            color: "#000000"
          },
          particles: {
            number: { value: 80, density: { enable: true, area: 800 } },
            color: { value: "#ffffff" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: { min: 1, max: 3 } },
            links: {
              enable: true,
              distance: 150,
              color: "#ffffff",
              opacity: 0.4,
              width: 1
            },
            move: {
              enable: true,
              speed: 1,
              direction: "none",
              outModes: { default: "out" }
            }
          },
          interactivity: {
            events: {
              onHover: { enable: true, mode: "grab" },
              onClick: { enable: true, mode: "push" }
            }
          },
          retina_detect: true
        }
      });
    }

    loadParticles();
  </script>

</body>
</html>
