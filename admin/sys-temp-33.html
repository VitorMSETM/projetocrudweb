<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Estoque Interno | Vyzee</title>
    <link rel="icon" href="../assets/icons/IconVyzeeGamer.ico" type="image/x-icon" />
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #facc15;
            --gold-dim: rgba(250, 204, 21, 0.15);
            --gold-border: rgba(250, 204, 21, 0.25);
            --bg: #080808;
            --surface: #111111;
            --surface2: #1a1a1a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background-color: var(--bg);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        #tsparticles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        header, main, footer { position: relative; z-index: 1; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* ── CARD ── */
        .card-gamer {
            background: var(--surface);
            border: 1px solid var(--gold-border);
            border-radius: 16px;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
        }
        .card-gamer:hover {
            border-color: rgba(250, 204, 21, 0.5);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.08);
            transform: translateY(-3px);
        }

        .gold-glow {
            color: var(--gold);
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.45);
            font-family: 'Space Mono', monospace;
        }

        /* ── BOTÃO ADICIONAR ── */
        .btn-add {
            background: var(--gold);
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 10px 0;
            width: 100%;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            letter-spacing: 0.05em;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-add:hover { background: #fde047; }
        .btn-add:active { transform: scale(0.97); }

        .btn-link {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold-border);
            border-radius: 10px;
            padding: 9px 0;
            width: 100%;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: block;
            letter-spacing: 0.04em;
            transition: border-color 0.2s, background 0.2s;
        }
        .btn-link:hover { border-color: var(--gold); background: var(--gold-dim); }

        /* ── CARRINHO OVERLAY ── */
        #cartOverlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #cartOverlay.open { opacity: 1; pointer-events: all; }

        /* ── CARRINHO SIDEBAR ── */
        #cartSidebar {
            position: fixed;
            top: 0; right: 0;
            height: 100%;
            width: min(420px, 100vw);
            background: var(--surface);
            border-left: 1px solid var(--gold-border);
            z-index: 50;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        #cartSidebar.open { transform: translateX(0); }

        .cart-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--gold-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            flex-shrink: 0;
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-item {
            background: var(--surface2);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .cart-item-price {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--gold);
            margin-top: 2px;
        }
        .cart-item-supplier {
            font-size: 10px;
            color: #666;
            margin-top: 1px;
        }

        /* Controles de quantidade */
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .qty-btn {
            width: 26px; height: 26px;
            border-radius: 6px;
            border: 1px solid var(--gold-border);
            background: transparent;
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
            line-height: 1;
        }
        .qty-btn:hover { background: var(--gold-dim); }
        .qty-display {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            min-width: 20px;
            text-align: center;
        }

        .btn-remove {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
            line-height: 1;
        }
        .btn-remove:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

        /* ── PAINEL FINANCEIRO ── */
        .cart-footer {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--gold-border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .finance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .finance-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;
            font-weight: 600;
        }
        .finance-value {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }
        .finance-total .finance-label { color: var(--gold); font-size: 12px; }
        .finance-total .finance-value { color: var(--gold); font-size: 18px; }

        .divider { height: 1px; background: var(--gold-border); margin: 8px 0; }

        /* Campo de valor recebido */
        .received-wrapper {
            margin: 12px 0;
        }
        .received-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .received-input-wrap {
            display: flex;
            align-items: center;
            background: var(--surface2);
            border: 1px solid var(--gold-border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .received-input-wrap:focus-within { border-color: var(--gold); }
        .received-prefix {
            padding: 0 12px;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            background: var(--gold-dim);
            height: 44px;
            display: flex; align-items: center;
        }
        .received-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            padding: 0 14px;
            height: 44px;
            width: 100%;
        }
        .received-input::placeholder { color: #444; font-size: 13px; }

        /* Bloco de lucro */
        .profit-block {
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .profit-block.positive { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); }
        .profit-block.negative { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); }
        .profit-block.neutral  { background: var(--surface2); border: 1px solid var(--gold-border); }
        .profit-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
        .profit-block.positive .profit-label { color: #4ade80; }
        .profit-block.negative .profit-label { color: #f87171; }
        .profit-block.neutral  .profit-label { color: #888; }
        .profit-value {
            font-family: 'Space Mono', monospace;
            font-size: 20px;
            font-weight: 700;
        }
        .profit-block.positive .profit-value { color: #4ade80; }
        .profit-block.negative .profit-value { color: #f87171; }
        .profit-block.neutral  .profit-value { color: #888; }

        /* Botão limpar */
        .btn-clear {
            width: 100%;
            margin-top: 14px;
            background: transparent;
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            border-radius: 10px;
            padding: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-clear:hover { background: rgba(239,68,68,0.1); border-color: #f87171; }

        /* ── BOTÃO FLUTUANTE DO CARRINHO ── */
        #cartFab {
            position: fixed;
            bottom: 24px; right: 24px;
            width: 60px; height: 60px;
            background: var(--gold);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            z-index: 35;
            box-shadow: 0 4px 20px rgba(250,204,21,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #cartFab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(250,204,21,0.55); }
        #cartFab:active { transform: scale(0.96); }

        #cartBadge {
            position: absolute;
            top: -4px; right: -4px;
            width: 22px; height: 22px;
            background: #ef4444;
            color: #fff;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg);
            font-family: 'Space Mono', monospace;
            display: none;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111;
            border: 1px solid var(--gold-border);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── SEARCH ── */
        .search-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--gold-border);
            border-radius: 14px;
            padding: 14px 20px;
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input::placeholder { color: #555; }
        .search-input:focus { border-color: var(--gold); }

        /* ── EMPTY STATE ── */
        .empty-cart {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            text-align: center;
            padding: 40px 20px;
        }
        .empty-cart-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .empty-cart-text { font-size: 13px; font-weight: 600; }

        /* Spinner */
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Badge contador de itens no topo do carrinho */
        .cart-count-badge {
            background: var(--gold);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 50px;
            font-family: 'Space Mono', monospace;
        }

        @media (max-width: 640px) {
            #cartSidebar { width: 100vw; }
        }
    </style>
</head>
<body>

    <div id="tsparticles"></div>
    <div id="toast">✓ Produto adicionado</div>

    <!-- ───────── HEADER ───────── -->
    <header style="position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(8,8,8,0.85);border-bottom:1px solid var(--gold-border);padding:14px 20px;">
        <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:22px;font-weight:800;letter-spacing:-0.02em;">
                    <span style="color:var(--gold);">Vy</span>zee
                    <span style="color:#555;font-weight:600;font-size:14px;margin-left:4px;">Estoque</span>
                </span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="font-size:10px;background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--gold);padding:5px 12px;border-radius:50px;text-transform:uppercase;font-weight:700;letter-spacing:0.08em;">
                    Acesso Interno
                </div>
                <button onclick="toggleCart()" style="background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--gold);padding:8px 16px;border-radius:50px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.2s;" onmouseover="this.style.background='rgba(250,204,21,0.25)'" onmouseout="this.style.background='var(--gold-dim)'">
                    🛒 <span id="headerCartLabel">Carrinho</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ───────── MAIN ───────── -->
    <main style="max-width:1280px;margin:0 auto;padding:32px 20px 120px;">

        <!-- Search -->
        <div style="margin-bottom:28px;">
            <input id="searchInput" type="text" placeholder="🔍  Pesquisar produto, fornecedor..." class="search-input">
        </div>

        <!-- Grid -->
        <div id="estoqueGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;">
            <div style="grid-column:1/-1;text-align:center;padding:80px 0;color:#555;">
                <div class="spinner" style="display:inline-block;width:32px;height:32px;border:3px solid var(--gold-border);border-top-color:var(--gold);border-radius:50%;margin-bottom:16px;"></div>
                <p style="font-size:13px;">Sincronizando com Google Sheets...</p>
            </div>
        </div>
    </main>

    <footer style="text-align:center;padding:32px;border-top:1px solid rgba(250,204,21,0.08);color:#333;font-size:11px;position:relative;z-index:1;">
        © Vyzee Brasil — Sistema de Gestão de Fornecedores
    </footer>

    <!-- ───────── FAB CARRINHO ───────── -->
    <button id="cartFab" onclick="toggleCart()">
        🛒
        <span id="cartBadge">0</span>
    </button>

    <!-- ───────── OVERLAY ───────── -->
    <div id="cartOverlay" onclick="toggleCart()"></div>

    <!-- ───────── SIDEBAR CARRINHO ───────── -->
    <aside id="cartSidebar">

        <!-- Cabeçalho -->
        <div class="cart-header">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:18px;font-weight:800;">Carrinho</span>
                <span class="cart-count-badge" id="cartCountBadge">0 itens</span>
            </div>
            <button onclick="toggleCart()" style="background:transparent;border:none;color:#666;font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px;transition:color 0.15s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#666'">✕</button>
        </div>

        <!-- Itens -->
        <div class="cart-body" id="cartBody">
            <div class="empty-cart" id="emptyCart">
                <div class="empty-cart-icon">🛒</div>
                <div class="empty-cart-text">Nenhum produto adicionado.<br>Clique em "+ Adicionar" nos cards.</div>
            </div>
        </div>

        <!-- Rodapé financeiro -->
        <div class="cart-footer" id="cartFooter" style="display:none;">

            <!-- Subtotal por custo -->
            <div class="finance-row">
                <span class="finance-label">Custo Total</span>
                <span class="finance-value" id="totalCusto">R$ 0,00</span>
            </div>

            <div class="divider"></div>

            <!-- Campo valor recebido -->
            <div class="received-wrapper">
                <div class="received-label">💰 Valor Recebido pelo Cliente</div>
                <div class="received-input-wrap">
                    <span class="received-prefix">R$</span>
                    <input type="number" step="0.01" min="0" id="valorRecebido" class="received-input" placeholder="0,00" oninput="calcularLucro()">
                </div>
            </div>

            <!-- Bloco de lucro -->
            <div class="profit-block neutral" id="profitBlock">
                <div>
                    <div class="profit-label" id="profitLabel">Lucro Estimado</div>
                    <div style="font-size:10px;color:#666;margin-top:2px;" id="profitMarginLabel"></div>
                </div>
                <div class="profit-value" id="profitValue">—</div>
            </div>

            <!-- Limpar -->
            <button class="btn-clear" onclick="limparCarrinho()">🗑 Limpar Carrinho</button>
        </div>

    </aside>

    <script>
        // ═══════════════════════════════════════
        //  CONFIGURAÇÃO
        // ═══════════════════════════════════════
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQGLFdufV8aeqeB9xbGJQ6SXWz6d3uiooIQht8PdRPsnDdEOdXZ6M8r2bwHbnE_7B2Vjr1fnhK9TftG/pub?output=csv';

        // ═══════════════════════════════════════
        //  ESTADO DO CARRINHO
        // ═══════════════════════════════════════
        let cart = {}; // { id: { nome, preco, fornecedor, qty } }

        // ═══════════════════════════════════════
        //  CARREGAR ESTOQUE
        // ═══════════════════════════════════════
        async function carregarEstoque() {
            try {
                const res  = await fetch(CSV_URL);
                const data = await res.text();
                const rows = data.split('\n').slice(1);
                const grid = document.getElementById('estoqueGrid');
                grid.innerHTML = '';

                rows.forEach((row, idx) => {
                    const cols = row.match(/(".*?"|[^,]+)(?=,|$)/g);
                    if (!cols || cols.length < 3) return;

                    const clean   = c => (c || '').replace(/^"|"$/g, '').trim();
                    const nome       = clean(cols[0]);
                    const precoStr   = clean(cols[1]);
                    const estado     = clean(cols[2]);
                    const fornecedor = clean(cols[3]) || 'Não informado';
                    const link       = clean(cols[4]) || '#';

                    const precoNum = parseFloat(precoStr.replace(',', '.')) || 0;
                    const id       = `item_${idx}`;

                    const card = document.createElement('div');
                    card.className    = 'card-gamer';
                    card.style.cssText = 'padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;';
                    card.dataset.text = (nome + fornecedor + estado).toLowerCase();
                    card.innerHTML = `
                        <div>
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                                <span style="font-size:9px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;border:1px solid var(--gold-border);padding:3px 8px;border-radius:50px;">📦 Estoque</span>
                                <span style="font-size:9px;color:#666;font-weight:600;text-transform:uppercase;">${estado || 'Brasil'}</span>
                            </div>
                            <h3 style="font-size:14px;font-weight:700;color:#fff;line-height:1.4;margin:0 0 6px;">${nome}</h3>
                            <p style="font-size:10px;color:#555;margin:0;">Fornecedor: <span style="color:#888;font-weight:600;">${fornecedor}</span></p>
                        </div>
                        <div>
                            <div style="margin-bottom:12px;">
                                <p style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:#555;font-weight:700;margin:0 0 2px;">Custo de Compra</p>
                                <p class="gold-glow" style="font-size:22px;font-weight:700;margin:0;">R$ ${precoStr}</p>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:7px;">
                                <button class="btn-add" onclick="adicionarAoCarrinho('${id}', '${nome.replace(/'/g,"\\'")}', ${precoNum}, '${fornecedor.replace(/'/g,"\\'")}')">
                                    + Adicionar ao Carrinho
                                </button>
                                <a href="${link}" target="_blank" class="btn-link">🛒 Comprar no Site</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                if (!grid.children.length) {
                    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#555;font-size:13px;">Nenhum produto encontrado na planilha.</div>';
                }
            } catch (err) {
                document.getElementById('estoqueGrid').innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:40px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:14px;color:#f87171;font-size:13px;">
                        ⚠️ Erro ao conectar com a planilha. Verifique se o link do CSV está correto e público.
                    </div>`;
            }
        }

        // ═══════════════════════════════════════
        //  CARRINHO — ADICIONAR
        // ═══════════════════════════════════════
        function adicionarAoCarrinho(id, nome, preco, fornecedor) {
            if (cart[id]) {
                cart[id].qty++;
            } else {
                cart[id] = { nome, preco, fornecedor, qty: 1 };
            }
            renderCarrinho();
            showToast(`✓ ${nome.substring(0,28)}${nome.length>28?'…':''}`);
            abrirCarrinho();
        }

        // ═══════════════════════════════════════
        //  CARRINHO — ALTERAR QUANTIDADE
        // ═══════════════════════════════════════
        function alterarQty(id, delta) {
            if (!cart[id]) return;
            cart[id].qty += delta;
            if (cart[id].qty <= 0) delete cart[id];
            renderCarrinho();
        }

        function removerItem(id) {
            delete cart[id];
            renderCarrinho();
        }

        // ═══════════════════════════════════════
        //  CARRINHO — LIMPAR
        // ═══════════════════════════════════════
        function limparCarrinho() {
            cart = {};
            document.getElementById('valorRecebido').value = '';
            renderCarrinho();
        }

        // ═══════════════════════════════════════
        //  CARRINHO — RENDERIZAR
        // ═══════════════════════════════════════
        function renderCarrinho() {
            const body       = document.getElementById('cartBody');
            const emptyCart  = document.getElementById('emptyCart');
            const footer     = document.getElementById('cartFooter');
            const badge      = document.getElementById('cartBadge');
            const countBadge = document.getElementById('cartCountBadge');
            const headerLabel = document.getElementById('headerCartLabel');

            const keys = Object.keys(cart);
            const totalQty = keys.reduce((s, k) => s + cart[k].qty, 0);

            // Badge FAB
            if (totalQty > 0) {
                badge.style.display = 'flex';
                badge.textContent   = totalQty;
            } else {
                badge.style.display = 'none';
            }

            countBadge.textContent = `${totalQty} ${totalQty === 1 ? 'item' : 'itens'}`;
            headerLabel.textContent = totalQty > 0 ? `Carrinho (${totalQty})` : 'Carrinho';

            // Limpar itens antigos (preserva emptyCart)
            Array.from(body.children).forEach(c => { if (c.id !== 'emptyCart') c.remove(); });

            if (keys.length === 0) {
                emptyCart.style.display = 'flex';
                footer.style.display = 'none';
                return;
            }

            emptyCart.style.display = 'none';
            footer.style.display    = 'block';

            keys.forEach(id => {
                const item = cart[id];
                const subtotal = (item.preco * item.qty).toFixed(2).replace('.', ',');
                const div  = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.nome}</div>
                        <div class="cart-item-price">R$ ${item.preco.toFixed(2).replace('.',',')} × ${item.qty} = <strong>R$ ${subtotal}</strong></div>
                        <div class="cart-item-supplier">${item.fornecedor}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="alterarQty('${id}', -1)">−</button>
                        <span class="qty-display">${item.qty}</span>
                        <button class="qty-btn" onclick="alterarQty('${id}', 1)">+</button>
                    </div>
                    <button class="btn-remove" onclick="removerItem('${id}')" title="Remover">✕</button>
                `;
                body.appendChild(div);
            });

            atualizarTotais();
        }

        // ═══════════════════════════════════════
        //  FINANCEIRO — TOTAIS
        // ═══════════════════════════════════════
        function totalCustoRaw() {
            return Object.values(cart).reduce((s, i) => s + i.preco * i.qty, 0);
        }

        function atualizarTotais() {
            const custo = totalCustoRaw();
            document.getElementById('totalCusto').textContent = `R$ ${custo.toFixed(2).replace('.',',')}`;
            calcularLucro();
        }

        function calcularLucro() {
            const recebidoRaw = parseFloat(document.getElementById('valorRecebido').value);
            const custo       = totalCustoRaw();
            const block       = document.getElementById('profitBlock');
            const val         = document.getElementById('profitValue');
            const lbl         = document.getElementById('profitLabel');
            const margin      = document.getElementById('profitMarginLabel');

            if (isNaN(recebidoRaw) || document.getElementById('valorRecebido').value === '') {
                block.className = 'profit-block neutral';
                val.textContent = '—';
                lbl.textContent = 'Lucro Estimado';
                margin.textContent = '';
                return;
            }

            const lucro       = recebidoRaw - custo;
            const margemPct   = custo > 0 ? ((lucro / recebidoRaw) * 100).toFixed(1) : 0;
            const lucroFmt    = `R$ ${Math.abs(lucro).toFixed(2).replace('.',',')}`;

            if (lucro > 0) {
                block.className     = 'profit-block positive';
                val.textContent     = `+${lucroFmt}`;
                lbl.textContent     = '🟢 Lucro';
                margin.textContent  = `Margem: ${margemPct}%`;
            } else if (lucro < 0) {
                block.className     = 'profit-block negative';
                val.textContent     = `−${lucroFmt}`;
                lbl.textContent     = '🔴 Prejuízo';
                margin.textContent  = `Déficit de R$ ${Math.abs(lucro).toFixed(2).replace('.',',')}`;
            } else {
                block.className     = 'profit-block neutral';
                val.textContent     = `R$ 0,00`;
                lbl.textContent     = '⚪ Empate';
                margin.textContent  = 'Margem: 0%';
            }
        }

        // ═══════════════════════════════════════
        //  TOGGLE CARRINHO
        // ═══════════════════════════════════════
        function toggleCart() {
            const sidebar  = document.getElementById('cartSidebar');
            const overlay  = document.getElementById('cartOverlay');
            const isOpen   = sidebar.classList.contains('open');
            sidebar.classList.toggle('open', !isOpen);
            overlay.classList.toggle('open', !isOpen);
            document.body.style.overflow = isOpen ? '' : 'hidden';
        }

        function abrirCarrinho() {
            const sidebar = document.getElementById('cartSidebar');
            if (!sidebar.classList.contains('open')) toggleCart();
        }

        // ═══════════════════════════════════════
        //  TOAST
        // ═══════════════════════════════════════
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ═══════════════════════════════════════
        //  BUSCA
        // ═══════════════════════════════════════
        document.getElementById('searchInput').addEventListener('input', e => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('#estoqueGrid > div[data-text]').forEach(card => {
                card.style.display = card.dataset.text.includes(term) ? '' : 'none';
            });
        });

        // ═══════════════════════════════════════
        //  PARTÍCULAS
        // ═══════════════════════════════════════
        tsParticles.load('tsparticles', {
            particles: {
                number: { value: 50, density: { enable: true, value_area: 900 } },
                color:  { value: '#facc15' },
                shape:  { type: 'circle' },
                opacity: { value: 0.25, random: true },
                size:    { value: 1.8, random: true },
                links:   { enable: true, distance: 140, color: '#facc15', opacity: 0.12, width: 1 },
                move:    { enable: true, speed: 0.8, direction: 'none', random: true, out_mode: 'out' }
            }
        });

        // ═══════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════
        carregarEstoque();
    </script>
</body>
</html>
